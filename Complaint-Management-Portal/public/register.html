<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Complaint Management Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container">
  <div class="card auth-card">
    <div class="card-header-cmp">
      <i class="bi bi-person-plus-fill"></i>
      <h4 class="fw-bold mb-0">Create Your Account</h4>
      <small>Register to submit and track complaints</small>
    </div>
    <div class="card-body">
      <div id="alertBox"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="e.g. Priya Sharma" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="e.g. 9876543210" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required minlength="6">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary-cmp w-100 py-2" id="submitBtn">
          <span id="btnText"><i class="bi bi-person-plus me-1"></i> Register</span>
        </button>
      </form>
      <p class="text-center mt-3 mb-0 text-muted">
        Already have an account? <a href="/login.html" class="fw-semibold">Login here</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNavbar('register');
if (isLoggedIn()) window.location.href = '/dashboard.html';

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('alertBox');

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    showAlert('alertBox', 'Passwords do not match. Please try again.', 'danger');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('btnText').innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Registering...';

  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, phone, password, confirmPassword })
    });
    setToken(data.token);
    setRole('user');
    setUserInfo(data.user);
    showAlert('alertBox', 'Registration successful! Redirecting to your dashboard...', 'success');
    setTimeout(() => window.location.href = '/dashboard.html', 900);
  } catch (err) {
    showAlert('alertBox', err.message, 'danger');
    btn.disabled = false;
    document.getElementById('btnText').innerHTML = '<i class="bi bi-person-plus me-1"></i> Register';
  }
});
</script>
</body>
</html>
