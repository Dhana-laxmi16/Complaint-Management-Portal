<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Complaint Management Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container">
  <div class="card auth-card">
    <div class="card-header-cmp" style="background:linear-gradient(135deg,#111827,#374151);">
      <i class="bi bi-shield-lock-fill"></i>
      <h4 class="fw-bold mb-0">Admin Login</h4>
      <small>Restricted access for portal administrators</small>
    </div>
    <div class="card-body">
      <div id="alertBox"></div>
      <form id="adminLoginForm" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Admin Email</label>
          <input type="email" class="form-control" id="email" placeholder="admin@complaintportal.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Admin password" required>
        </div>
        <button type="submit" class="btn w-100 py-2 text-white fw-semibold" style="background:#111827;border-radius:10px;" id="submitBtn">
          <span id="btnText"><i class="bi bi-shield-lock me-1"></i> Login as Admin</span>
        </button>
      </form>
      <p class="text-center mt-3 mb-0">
        <a href="/login.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Back to User Login</a>
      </p>
      <div class="alert alert-secondary small mt-3 mb-0">
        <i class="bi bi-info-circle me-1"></i> Default credentials are set in the <code>.env</code> file (<code>ADMIN_EMAIL</code> / <code>ADMIN_PASSWORD</code>).
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
