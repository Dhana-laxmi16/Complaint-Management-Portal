<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Complaint Management Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container">
  <div class="card auth-card">
    <div class="card-header-cmp">
      <i class="bi bi-box-arrow-in-right"></i>
      <h4 class="fw-bold mb-0">Welcome Back</h4>
      <small>Login to manage your complaints</small>
    </div>
    <div class="card-body">
      <div id="alertBox"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary-cmp w-100 py-2" id="submitBtn">
          <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Login</span>
        </button>
      </form>
      <p class="text-center mt-3 mb-0 text-muted">
        Don't have an account? <a href="/register.html" class="fw-semibold">Register here</a>
      </p>
      <p class="text-center mt-2 mb-0">
        <a href="/admin-login.html" class="small text-muted"><i class="bi bi-shield-lock me-1"></i>Login as Admin instead</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNavbar('login');
if (isLoggedIn()) window.location.href = '/dashboard.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('alertBox');

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('btnText').innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Logging in...';

  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    setToken(data.token);
    setRole('user');
    setUserInfo(data.user);
    showAlert('alertBox', data.message, 'success');
    setTimeout(() => window.location.href = '/dashboard.html', 700);
  } catch (err) {
    showAlert('alertBox', err.message, 'danger');
    btn.disabled = false;
    document.getElementById('btnText').innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Login';
  }
});
</script>
</body>
</html>
